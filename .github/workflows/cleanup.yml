name: Cleanup template content

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Remove template sample content and pages
        run: |
          rm -rf _posts _talks _teaching _portfolio _drafts
          rm -f _pages/archive-layout-with-content.md
          rm -f _pages/category-archive.html
          rm -f _pages/collection-archive.html
          rm -f _pages/cv.md
          rm -f _pages/markdown.md
          rm -f _pages/non-menu-page.md
          rm -f _pages/page-archive.html
          rm -f _pages/portfolio.html
          rm -f _pages/sitemap.md
          rm -f _pages/tag-archive.html
          rm -f _pages/talkmap.html
          rm -f _pages/talks.html
          rm -f _pages/teaching.html
          rm -f _pages/terms.md
          rm -f _pages/year-archive.html
          rm -f .github/workflows/cleanup.yml
      - name: Commit and push
        run: |
          git config user.name "spadonidittrichmt848-pixel"
          git config user.email "spadonidittrichmt848-pixel@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo 'nothing to commit' || git commit -m "Remove template sample content and unused pages"
          git push origin master
